name: Na-Ryby Wellness Srub 17536 Exact Buyer Click Public
on:
  pull_request:
    paths:
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-buyer-clicks-v1.js'
      - 'scripts/verify-wellness-srub-click-public-17536.py'
      - 'tests/test-wellness-srub-click-public-17536.py'
      - 'tests/test-buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.mjs'
      - '.github/workflows/wellness-srub-click-public-17536.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Consent and exact two source-pinned CTA offline fixture proof
        run: |
          set -euo pipefail
          php tests/test-buyer-click-telemetry-v1.php
          node --check assets/nry-buyer-clicks-v1.js
          node tests/test-buyer-click-telemetry-v1.mjs
          python3 tests/test-wellness-srub-click-public-17536.py
  public:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Independent site-local exact two CTA and bundled JS byte readback
        run: |
          set -euo pipefail
          python3 tests/test-wellness-srub-click-public-17536.py
          python3 scripts/verify-wellness-srub-click-public-17536.py --verify
