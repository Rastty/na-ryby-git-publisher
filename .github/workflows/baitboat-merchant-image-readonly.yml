name: Na-Ryby Baitboat Merchant Photo Source Readonly
on:
  pull_request:
    paths:
      - 'scripts/audit-baitboat-merchant-image-candidates.py'
      - '.github/workflows/baitboat-merchant-image-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile scripts/audit-baitboat-merchant-image-candidates.py
      - run: python3 scripts/audit-baitboat-merchant-image-candidates.py
