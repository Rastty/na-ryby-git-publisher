name: Na-Ryby Kruzberk 12877 Exact Source Proof (GET only)
on:
  pull_request:
    paths:
      - 'kruzberk-source-proof-12877-v1.php'
      - 'scripts/verify-kruzberk-source-proof-12877.py'
      - 'tests/test-kruzberk-source-proof-12877-v1.php'
      - 'tests/test-kruzberk-source-proof-12877.py'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exact source identity without storing or returning article content
        run: |
          php -l na-ryby-git-publisher.php
          php -l kruzberk-source-proof-12877-v1.php
          php tests/test-kruzberk-source-proof-12877-v1.php
          python3 -m py_compile scripts/verify-kruzberk-source-proof-12877.py
          python3 tests/test-kruzberk-source-proof-12877.py
  public:
    needs: contract
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous GET-only original WordPress source digest
        run: python3 scripts/verify-kruzberk-source-proof-12877.py --verify
