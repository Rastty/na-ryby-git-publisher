name: Na-Ryby Fishing Stays Affiliate V9 Offline Contract
on:
  pull_request:
    paths:
      - 'editorial/fishing-stays-cz-20261118.json'
      - 'editorial/fishing-stays-cz-20261118-recommendation-blocks.html'
      - 'scripts/build-fishing-stays-cz-manifest-v9.mjs'
      - 'fishing-stays-cz-59891-release-v9.json'
      - 'scripts/verify-fishing-stays-cz-offline-v1.mjs'
      - 'tests/test-fishing-stays-affiliate-release-v9.php'
      - 'tests/test-fishing-stays-v9-trusted-write-scope.php'
  push:
    branches: [main]
    paths:
      - 'editorial/fishing-stays-cz-20261118.json'
      - 'editorial/fishing-stays-cz-20261118-recommendation-blocks.html'
      - 'scripts/build-fishing-stays-cz-manifest-v9.mjs'
      - 'fishing-stays-cz-59891-release-v9.json'
      - 'scripts/verify-fishing-stays-cz-offline-v1.mjs'
      - 'tests/test-fishing-stays-affiliate-release-v9.php'
      - 'tests/test-fishing-stays-v9-trusted-write-scope.php'
permissions:
  contents: read
jobs:
  immutable-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact merchant evidence and source-bound HTML digest
        run: node scripts/verify-fishing-stays-cz-offline-v1.mjs
      - name: Verify existing publisher and immutable affiliate schema syntax
        run: |
          php -l na-ryby-git-publisher.php
          php -l tests/test-fishing-stays-affiliate-release-v9.php
          php -l tests/test-fishing-stays-v9-trusted-write-scope.php
          node --check scripts/build-fishing-stays-cz-manifest-v9.mjs
      - name: Reject altered partner links, post targets and source fingerprints
        run: |
          node scripts/build-fishing-stays-cz-manifest-v9.mjs --stdout | cmp - fishing-stays-cz-59891-release-v9.json
          node scripts/build-fishing-stays-cz-manifest-v9.mjs --stdout | php tests/test-fishing-stays-affiliate-release-v9.php
          php tests/test-fishing-stays-v9-trusted-write-scope.php
