name: Na-Ryby Stredni Cechy Stay Offer Trust Public Proof
on:
  pull_request:
    paths:
      - 'na-ryby-git-publisher.php'
      - 'stredni-cechy-stay-offer-trust-92205-v1.php'
      - 'assets/nry-stredni-cechy-stay-offer-v1.css'
      - 'tests/test-stredni-cechy-stay-offer-trust-92205-v1.php'
      - 'scripts/verify-stredni-cechy-stay-offer-public-92205.py'
      - '.github/workflows/stredni-cechy-stay-offer-public-92205.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Bounded offline contract, source and syntax
        run: |
          php -l na-ryby-git-publisher.php
          php -l stredni-cechy-stay-offer-trust-92205-v1.php
          php tests/test-stredni-cechy-stay-offer-trust-92205-v1.php
          python3 -m py_compile scripts/verify-stredni-cechy-stay-offer-public-92205.py
          python3 tests/test-deployer-trigger-parity.py
  public:
    needs: contract
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous strict preflight or deployed readback
        env:
          PHASE: ${{ github.event_name == 'pull_request' && 'preflight' || 'verify' }}
        run: python3 scripts/verify-stredni-cechy-stay-offer-public-92205.py --"${PHASE}"
