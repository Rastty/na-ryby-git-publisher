name: Na-Ryby Four Legacy Buyer Handoff Measurement
on:
  pull_request:
    paths:
      - 'assets/nry-legacy-buyer-handoff-v1.js'
      - 'tests/test-legacy-buyer-handoff-v1.php'
      - 'tests/test-legacy-buyer-handoff-v1.mjs'
      - '.github/workflows/legacy-buyer-handoff-measurement.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          php -l buyer-click-telemetry-v1.php
          php tests/test-buyer-click-telemetry-v1.php
          php tests/test-legacy-buyer-handoff-v1.php
          node tests/test-legacy-buyer-handoff-v1.mjs
  public:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require actual guarded production deploy at exact main SHA
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
          NRY_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          NRY_UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$NRY_UPSTREAM_HEAD_SHA" = "$GITHUB_SHA"
          result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NRY_UPSTREAM_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')"
          if [ "$result" != 'success' ]; then
            echo 'SKIP: guarded transport was not successful'
            echo 'live=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'live=true' >> "$GITHUB_OUTPUT"
      - name: Verify four exact panel CTAs and local JS byte identity (GET only)
        if: steps.deployed.outputs.live == 'true'
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request
          from pathlib import Path
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import hashlib,time
          base='https://na-ryby.eu'
          asset='/wp-content/plugins/na-ryby-git-publisher/assets/nry-legacy-buyer-handoff-v1.js?ver=1.0.0'
          cases=(
            ('/recenze-a-zkusenosti-lowrance-echolot-hds-live-7-se-sondou-active-imaging-3v1-baterie-nabijecka-zdarma/','data-nry-legacy-sonar-bridge','data-nry-legacy-sonar-kind','hds_live_7','/jak-vybrat-echolot-pro-rybareni-kompletni-pruvodce/'),
            ('/lowrance-echolot-hook-4-chirp-gps/','data-nry-legacy-sonar-bridge','data-nry-legacy-sonar-kind','hook_4','/jak-vybrat-echolot-pro-rybareni-kompletni-pruvodce/'),
            ('/holdcarp-solarni-panel-foldable-solar-system-20w-recenze/','data-nry-holdcarp-energy-bridge','data-nry-holdcarp-model','20W','/powerbanka-nebo-solarni-panel-na-ryby/'),
            ('/holdcarp-solarni-panel-foldable-solar-system-40w-recenze/','data-nry-holdcarp-energy-bridge','data-nry-holdcarp-model','40W','/powerbanka-nebo-solarni-panel-na-ryby/')
          )
          class Doc(HTMLParser):
              def __init__(self,marker,role):
                  super().__init__();self.marker=marker;self.role=role
                  self.canonical=[];self.scripts=[];self.panels=[];self.anchors=[];self.inside=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and 'canonical' in (a.get('rel') or '').split(): self.canonical.append(a.get('href'))
                  if tag=='script' and 'nry-legacy-buyer-handoff-v1.js' in (a.get('src') or ''): self.scripts.append(a.get('src'))
                  if tag=='aside' and a.get(self.marker)=='v1':
                      self.panels.append(a.get(self.role));self.inside=True
                  if self.inside and tag=='a' and 'href' in a: self.anchors.append(a['href'])
              def handle_endtag(self,tag):
                  if tag=='aside' and self.inside: self.inside=False
          def get(url,bound):
              with guarded_urlopen(Request(url,method='GET',headers={'User-Agent':'NaRybyLegacyHandoffProof/1.0','Cache-Control':'no-cache'}),timeout=25) as resp:
                  if resp.status!=200 or resp.geturl()!=url: raise ValueError('EXACT_URL_NOT_200')
                  body=resp.read(bound+1)
              if len(body)>bound: raise ValueError('BODY_OVERSIZE')
              return body
          for path,marker,role,variant,dest in cases:
              for attempt in range(3):
                  try:
                      parser=Doc(marker,role);parser.feed(get(base+path,900000).decode('utf-8'));parser.close()
                      assert parser.canonical==[base+path], 'CANONICAL_DRIFT'
                      assert parser.panels==[variant], 'PANEL_DRIFT'
                      assert parser.anchors==[base+dest], 'CTA_DRIFT'
                      assert parser.scripts==[base+asset], 'SCRIPT_DRIFT'
                      print('LEGACY_BUYER_HANDOFF_PUBLIC_PASS',variant);break
                  except (AssertionError,OSError,ValueError) as err:
                      print('PUBLIC_UNVERIFIED',variant,type(err).__name__,attempt+1)
                      if attempt==2:raise
                      time.sleep(4)
          local=Path('assets/nry-legacy-buyer-handoff-v1.js').read_bytes()
          served=get(base+asset,50000)
          assert hashlib.sha256(served).digest()==hashlib.sha256(local).digest(),'SCRIPT_SHA_DRIFT'
          print('LEGACY_BUYER_HANDOFF_FOUR_PUBLIC_VERIFIED',hashlib.sha256(served).hexdigest(),
                'realClicks=UNKNOWN; GA4Ingestion=UNKNOWN; paidCommissions=UNKNOWN; syntheticClicks=0')
          PY
