name: Na-Ryby Sitewide Two Stay Menu Choices Public Proof
on:
  pull_request:
    paths:
      - 'stays-main-navigation-bridge-v1.php'
      - 'assets/nry-stays-menu-click-v1.js'
      - 'tests/test-stays-main-navigation-bridge-v1.php'
      - 'tests/test-stays-main-menu-click-v1.mjs'
      - 'scripts/verify-stays-main-menu-public-v1.py'
      - 'tests/test-stays-main-menu-public-v1.py'
      - '.github/workflows/sitewide-stays-menu-public-v1.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: nry-stays-menu-proof-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP menu ownership; trusted JS clicks; public structure negative tests
        run: |
          set -euo pipefail
          php -l stays-main-navigation-bridge-v1.php
          php tests/test-stays-main-navigation-bridge-v1.php
          node --check assets/nry-stays-menu-click-v1.js
          node tests/test-stays-main-menu-click-v1.mjs
          python3 -m py_compile scripts/verify-stays-main-menu-public-v1.py
          python3 tests/test-stays-main-menu-public-v1.py
  public:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm protected deploy SUCCESS for exact main release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          NRY_RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          NRY_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$NRY_RELEASE_SHA" = "$GITHUB_SHA" || {
            echo 'BLOCKED: protected release SHA differs from this main checkout'
            exit 1
          }
          result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NRY_RELEASE_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')"
          test "$result" = success || {
            echo 'BLOCKED: protected deploy job did not succeed'
            exit 1
          }
          echo 'PASS: exact-main protected deploy succeeded'
      - name: Two public page/menu observations plus exact served JS (GET only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 scripts/verify-stays-main-menu-public-v1.py --verify; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 7; fi
          done
          exit 1
