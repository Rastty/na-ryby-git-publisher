name: Na-Ryby Line Bible Buyer Choice Public Proof
on:
  pull_request:
    paths:
      - 'line-bible-fast-choice-115678-v1.php'
      - 'assets/nry-line-fast-choice-v1.css'
      - 'scripts/verify-line-bible-fast-choice-public.py'
      - '.github/workflows/line-bible-fast-choice-public-v1.yml'
  push:
    branches: [main]
    paths:
      - 'line-bible-fast-choice-115678-v1.php'
      - 'assets/nry-line-fast-choice-v1.css'
      - 'scripts/verify-line-bible-fast-choice-public.py'
      - '.github/workflows/line-bible-fast-choice-public-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nry-line-bible-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only live WordPress and public canonical proof
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-line-bible-fast-choice-public.py
          python3 scripts/verify-line-bible-fast-choice-public.py
