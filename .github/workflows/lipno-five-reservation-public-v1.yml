name: Na-Ryby Lipno Five Reservation Paths Public Proof
on:
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  public:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require actual guarded deployment success
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')" = success
      - name: Five live articles and exact partner destinations (GET only)
        run: python3 scripts/verify-lipno-five-reservation-public-v1.py
