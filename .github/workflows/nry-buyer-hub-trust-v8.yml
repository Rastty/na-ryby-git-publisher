name: Na-Ryby Buyer Hub Trust Repair Exact Release
on:
  pull_request:
    paths:
      - 'manifest.json'
      - 'tests/test-production-buyer-hub-60341-v8.php'
      - 'scripts/verify-current-manifest-public.py'
      - 'tests/test-auto-public-readback.py'
      - '.github/workflows/nry-buyer-hub-trust-v8.yml'
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'tests/test-production-buyer-hub-60341-v8.php'
      - 'scripts/verify-current-manifest-public.py'
      - 'tests/test-auto-public-readback.py'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  reviewed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact reviewed original source and safe corrections
        run: |
          set -euo pipefail
          php -l tests/test-production-buyer-hub-60341-v8.php
          php tests/test-production-buyer-hub-60341-v8.php
          python3 tests/test-auto-public-readback.py -v
  independent-live-proof:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    needs: reviewed-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify actual HTML removed old false manufacturer and sales claims
        run: |
          set -euo pipefail
          python3 scripts/verify-current-manifest-public.py manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-ryby-buyer-hub-trust-independent-proof
          path: auto-publisher-public-readback.json
          retention-days: 14
          if-no-files-found: warn
