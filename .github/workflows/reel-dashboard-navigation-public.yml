name: Na-Ryby Reel Dashboard Next Steps Public Readback
on:
  pull_request:
    paths:
      - 'reel-dashboard-nextsteps-v1.php'
      - 'tests/test-reel-dashboard-nextsteps-v1.php'
      - 'scripts/verify-reel-dashboard-nextsteps-public.py'
      - '.github/workflows/reel-dashboard-navigation-public.yml'
  workflow_dispatch:
  schedule:
    - cron: '19 5 * * *'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exact page guard, editor safety and no-writes contract
        run: |
          php -l reel-dashboard-nextsteps-v1.php
          php tests/test-reel-dashboard-nextsteps-v1.php
          python3 -m py_compile scripts/verify-reel-dashboard-nextsteps-public.py
  live-readback:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Confirm four exact first-party paths on live WordPress
        run: python3 scripts/verify-reel-dashboard-nextsteps-public.py
