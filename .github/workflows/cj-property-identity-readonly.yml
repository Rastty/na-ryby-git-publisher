name: CJ property identity (read-only)

on:
  pull_request:
    paths:
      - 'scripts/audit-cj-property-identity-public.py'
      - 'tests/test-cj-property-identity-public.py'
      - 'buyer-click-telemetry-v1.php'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-cj-property-identity-public.py'
      - 'tests/test-cj-property-identity-public.py'
      - 'buyer-click-telemetry-v1.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded read-only contract
        run: python3 tests/test-cj-property-identity-public.py

  live-readonly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory own and cross-site CJ property IDs (no merchant requests)
        run: python3 scripts/audit-cj-property-identity-public.py --require-complete > cj-property-readonly.json
      - name: Show safe, count-only risk summary
        if: always()
        run: |
          if [ -f cj-property-readonly.json ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("CJ property identity — public-only audit"); print("Guides verified: %s/%s" % (d["verified_count"], d["cohort_count"])); print("CJ links with known other-site ID: %s on %s pages" % (d["counts"]["cj_other_known_site_property"], d["known_other_site_property_pages"])); print("Frontend risk counts match REST: %s" % d["frontend_cross_site_counts_match"]); print("No affiliate links were rewritten or clicked.")' cj-property-readonly.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cj-property-readonly
          path: cj-property-readonly.json
          if-no-files-found: warn
          retention-days: 14
