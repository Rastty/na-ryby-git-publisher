name: Publisher V5-V7 PHP Contract
on:
  pull_request:
    paths:
      - 'na-ryby-git-publisher.php'
      - 'manifest.json'
      - 'tests/**'
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-buyer-clicks-v1.js'
      - '.github/workflows/v5-php-contract.yml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'na-ryby-git-publisher.php'
      - 'manifest.json'
      - 'tests/**'
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-buyer-clicks-v1.js'
      - '.github/workflows/v5-php-contract.yml'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  php-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -v
          php -l na-ryby-git-publisher.php
          php -l tests/test-v5-native-release.php
          php -l tests/test-v6-chair-native-release.php
          php -l tests/test-v7-chair-native-release.php
          php -l buyer-click-telemetry-v1.php
          php -l tests/test-buyer-click-telemetry-v1.php
          php -l gsc-revir-stays-seo-20261120-v1.php
          php -l tests/test-gsc-revir-stays-seo-20261120-v1.php
          php -l home-revir-stay-paths-118641-v1.php
          php -l tests/test-home-revir-stay-paths-118641-v1.php
      - name: Source-bound and reversible v5 contract
        run: |
          php tests/test-v5-native-release.php
          php tests/test-v6-chair-native-release.php
          php tests/test-v7-chair-native-release.php
          php tests/test-buyer-click-telemetry-v1.php
          node tests/test-buyer-click-telemetry-v1.mjs
          php tests/test-gsc-revir-stays-seo-20261120-v1.php
          php tests/test-home-revir-stay-paths-118641-v1.php
      - name: Offline workflow trigger-scope contract (zero public requests)
        run: python3 tests/test-ci-trigger-scoping.py
