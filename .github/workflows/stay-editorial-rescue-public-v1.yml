name: Na-Ryby Editorial Stay Rescue Public Proof
on:
  pull_request:
    paths:
      - 'private-stays-operator-guide-v1.php'
      - 'editorial/private-stays-operator-guide-20261128.html'
      - '.github/workflows/stay-editorial-rescue-public-v1.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  source_preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One current published source and exact transform (GET only)
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,html
          from pathlib import Path
          from urllib.request import Request
          from scripts.readonly_urlopen_retry import guarded_urlopen
          slug='nejlepsi-soukrome-reviry-s-ubytovanim-v-ceske-republice-zazitek-ktery-stoji-za-to'
          url='https://na-ryby.eu/wp-json/wp/v2/posts?slug='+slug+'&_fields=id,slug,date,title,link,content,status'
          with guarded_urlopen(Request(url,headers={'User-Agent':'NaRybyEditorialSource/1.0','Cache-Control':'no-cache'}),timeout=25) as r:
              data=json.load(r)
          assert len(data)==1
          p=data[0]
          assert p['slug']==slug and p['status']=='publish' and p['date'][:10]=='2024-05-04' and p['link']=='https://na-ryby.eu/'+slug+'/'
          assert html.unescape(p['title']['rendered'])=='Nejlepší soukromé revíry s ubytováním v České republice: Zážitek, který stojí za to'
          Path('private-stay-source-ephemeral.html').write_text(p['content']['rendered'],encoding='utf-8')
          print('PRIVATE_STAY_SOURCE_ID',p['id'])
          PY
          php -r 'define("ABSPATH",__DIR__);require "private-stays-operator-guide-v1.php";$old=file_get_contents("private-stay-source-ephemeral.html");$new=NRY_Private_Stays_Operator_Guide_V1::transform($old);if($new===$old||substr_count($new,NRY_Private_Stays_Operator_Guide_V1::MARKER)!==1){fwrite(STDERR,"SOURCE_TRANSFORM_GUARD_BLOCKED\n");exit(1);}echo "PRIVATE_STAY_SOURCE_TRANSFORM_READY\n";'
          rm -f private-stay-source-ephemeral.html
  public:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm guarded deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')" = success
      - name: One anonymous readback; no merchant requests or clicks
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          url='https://na-ryby.eu/tipy-pro-perfektni-rybareni-a-ubytovani-u-vody/'
          urls={
            'kohoutu':'https://go.dognet.com/?chid=5QoXiSqx&url=https%3A%2F%2Fhportal.cz%2Fcs%2Fhorni-plana%2Fpenzion-u-kohoutu%2F',
            'cyklo':'https://tracking.affiliateport.eu/click?o=1990&a=1736&sub_id5=https%3A%2F%2Fwww.hauzi.cz%2Fcyklochata',
            'srub':'https://tracking.affiliateport.eu/click?o=1990&a=1736&sub_id5=https%3A%2F%2Fwww.hauzi.cz%2Frybarsky-srub',
          }
          class P(HTMLParser):
              def __init__(self): super().__init__();self.mark=0;self.h1=0;self.links=[];self.canon=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='section' and a.get('data-nry-stay-editorial-rescue')=='v1':self.mark+=1
                  if t=='h1':self.h1+=1
                  if t=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href'))
                  if t=='a' and 'data-nry-stay-editorial-offer' in a:self.links.append((a.get('data-nry-stay-editorial-offer'),a.get('href'),a.get('rel')))
          with urlopen(Request(url+'?nry_release_readback=20261128',headers={'User-Agent':'NaRybyPublicProof/1.0','Cache-Control':'no-cache'}),timeout=30) as resp:
              assert resp.status==200 and urlparse(resp.geturl()).hostname=='na-ryby.eu'
              html=resp.read(3000000).decode('utf-8')
          p=P();p.feed(html)
          assert p.canon==[url],('canonical',p.canon)
          assert p.mark==1,('marker',p.mark)
          assert p.h1==1,('h1',p.h1)
          assert p.links==[(k,v,'sponsored nofollow noopener') for k,v in urls.items()],('offers',len(p.links))
          for placeholder in ('Dobrovolník českého jazyka','Tady napsat text o tipy na','Lorem ipsum dolor sit amet, consectetur adipiscing elit.','Nulla facilisi. Nam faucibus lacus ut dolor porttitor,'):
              assert placeholder not in html,('placeholder',placeholder)
          assert 'Modelové srovnání nákladů' in html
          print('STAY_EDITORIAL_RESCUE_PUBLIC_VERIFIED 1/1 three partner exits, one H1, four placeholders removed')
          PY
      - name: Independent public private-water guide, three operator destinations
        run: |
          python3 - <<'PY'
          from urllib.request import Request
          from html.parser import HTMLParser
          from scripts.readonly_urlopen_retry import guarded_urlopen
          slug='nejlepsi-soukrome-reviry-s-ubytovanim-v-ceske-republice-zazitek-ktery-stoji-za-to'
          url='https://na-ryby.eu/'+slug+'/'
          links={'velky':'https://www.rybnikvelky.cz/cz/sluzby-a-cenik/','grunty':'https://www.grunty.cz/','janko':'https://www.farmajanko.cz/rybnik/'}
          class P(HTMLParser):
              def __init__(self): super().__init__();self.mark=0;self.h1=0;self.canon=[];self.links=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='section' and a.get('data-nry-private-stays-operator-guide')=='v1':self.mark+=1
                  if t=='h1':self.h1+=1
                  if t=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href'))
                  if t=='a' and 'data-nry-private-operator' in a:self.links.append((a['data-nry-private-operator'],a.get('href')))
          with guarded_urlopen(Request(url+'?nry_release_readback=20261128',headers={'User-Agent':'NaRybyPublicProof/1.0','Cache-Control':'no-cache'}),timeout=25) as r:
              h=r.read(3000000).decode('utf-8')
          p=P();p.feed(h)
          assert p.canon==[url] and p.mark==1 and p.h1==1,('structure',p.mark,p.h1)
          assert p.links==list(links.items()),('operators',p.links)
          for bad in ('Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis vehicula','rybarstvipecka.cz','rybnikzlatnik.cz','rybnikbabincz','revír Božanov'):
              assert bad.lower() not in h.lower(),('historical claim',bad)
          assert 'Modelový víkend dvou rybářů' in h
          print('PRIVATE_STAY_OPERATOR_GUIDE_PUBLIC_VERIFIED 1/1 three real operators, one H1, cost comparison')
          PY
