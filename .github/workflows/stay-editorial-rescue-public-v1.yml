name: Na-Ryby Editorial Stay Rescue Public Proof
on:
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  public:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm guarded deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')" = success
      - name: One anonymous readback; no merchant requests or clicks
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          url='https://na-ryby.eu/tipy-pro-perfektni-rybareni-a-ubytovani-u-vody/'
          urls={
            'kohoutu':'https://go.dognet.com/?chid=5QoXiSqx&url=https%3A%2F%2Fhportal.cz%2Fcs%2Fhorni-plana%2Fpenzion-u-kohoutu%2F',
            'cyklo':'https://tracking.affiliateport.eu/click?o=1990&a=1736&sub_id5=https%3A%2F%2Fwww.hauzi.cz%2Fcyklochata',
            'srub':'https://tracking.affiliateport.eu/click?o=1990&a=1736&sub_id5=https%3A%2F%2Fwww.hauzi.cz%2Frybarsky-srub',
          }
          class P(HTMLParser):
              def __init__(self): super().__init__();self.mark=0;self.h1=0;self.links=[];self.canon=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='section' and a.get('data-nry-stay-editorial-rescue')=='v1':self.mark+=1
                  if t=='h1':self.h1+=1
                  if t=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href'))
                  if t=='a' and 'data-nry-stay-editorial-offer' in a:self.links.append((a.get('data-nry-stay-editorial-offer'),a.get('href'),a.get('rel')))
          with urlopen(Request(url+'?nry_release_readback=20261128',headers={'User-Agent':'NaRybyPublicProof/1.0','Cache-Control':'no-cache'}),timeout=30) as resp:
              assert resp.status==200 and urlparse(resp.geturl()).hostname=='na-ryby.eu'
              html=resp.read(3000000).decode('utf-8')
          p=P();p.feed(html)
          assert p.canon==[url],('canonical',p.canon)
          assert p.mark==1,('marker',p.mark)
          assert p.h1==1,('h1',p.h1)
          assert p.links==[(k,v,'sponsored nofollow noopener') for k,v in urls.items()],('offers',len(p.links))
          for placeholder in ('Dobrovolník českého jazyka','Tady napsat text o tipy na','Lorem ipsum dolor sit amet, consectetur adipiscing elit.','Nulla facilisi. Nam faucibus lacus ut dolor porttitor,'):
              assert placeholder not in html,('placeholder',placeholder)
          assert 'Modelové srovnání nákladů' in html
          print('STAY_EDITORIAL_RESCUE_PUBLIC_VERIFIED 1/1 three partner exits, one H1, four placeholders removed')
          PY
