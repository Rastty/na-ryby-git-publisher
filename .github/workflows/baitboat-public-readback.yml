name: Na-Ryby Baitboat Independent Public Readback
on:
  pull_request:
    paths:
      - 'scripts/verify-baitboat-live-v1.py'
      - '.github/workflows/baitboat-public-readback.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-baitboat-live-v1.py'
      - '.github/workflows/baitboat-public-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent HTTP proof for exact approved HTML and merchant links
        run: python3 scripts/verify-baitboat-live-v1.py
