name: Na-Ryby Guarded Deployer Push-to-Deploy
on:
  pull_request:
    paths:
      - 'manifest.json'
      - 'tests/test-pipaky-42401-quick-choice-v8.php'
      - 'tests/test-42401-public-semantic.py'
      - 'scripts/verify-current-manifest-public.py'
      - 'advisor-existing-page-release-v1.php'
      - 'guarded-auto-publisher.php'
      - 'tests/test-native-kses-write-contract.php'
      - 'tests/test-buyer-hub-trust-repair-v8.php'
      - 'tests/test-echolot-budget-118455-v8.php'
      - 'tests/test-echolot-pillar-118553-v8.php'
      - 'tests/test-alarm-guide-trust-118218-v8.php'
      - 'tests/test-alarm-score-cleanup-118218-v8.php'
      - 'tests/test-three-chair-guides-v8.php'
      - 'tests/test-evergreen-chair-v8.php'
      - 'tests/test-production-buyer-hub-60341-v8.php'
      - 'tests/test-buyer-source-proof.php'
      - 'tests/test-advisor-existing-page-release-v1.php'
      - 'na-ryby-git-publisher.php'
      - 'seo-pipaky-beginner-35755-v1.php'
      - 'seo-pipaky-advanced-description-36702-v1.php'
      - 'tests/test-pipaky-beginner-serp-35755-v1.php'
      - 'tests/test-pipaky-diagnostics-35755-v8.php'
      - 'tests/test-pipaky-advanced-36702-v8.php'
      - 'tests/test-pipaky-36702-five-price-fix-v8.php'
      - 'tests/test-pipaky-advanced-description-36702-v1.php'
      - 'buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.mjs'
      - '.github/workflows/guarded-deployer-push.yml'
      - 'seo-snippet-pilot.php'
      - 'checklist-release-v1.php'
      - 'assets/**'
      - 'tests/test-deployer-trigger-parity.py'
      - 'scripts/readonly_urlopen_retry.py'
      - 'tests/test-readonly-urlopen-retry.py'
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'tests/test-pipaky-42401-quick-choice-v8.php'
      - 'tests/test-42401-public-semantic.py'
      - 'scripts/verify-current-manifest-public.py'
      - 'advisor-existing-page-release-v1.php'
      - 'guarded-auto-publisher.php'
      - 'tests/test-three-chair-guides-v8.php'
      - 'tests/test-evergreen-chair-v8.php'
      - 'tests/test-buyer-source-proof.php'
      - 'tests/test-advisor-existing-page-release-v1.php'
      - 'na-ryby-git-publisher.php'
      - 'buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.mjs'
      - 'seo-snippet-pilot.php'
      - 'checklist-release-v1.php'
      - 'assets/**'
      - 'seo-pipaky-beginner-35755-v1.php'
      - 'seo-pipaky-advanced-description-36702-v1.php'
      - '.github/workflows/guarded-deployer-push.yml'
      - 'scripts/readonly_urlopen_retry.py'
      - 'tests/test-readonly-urlopen-retry.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nry-guarded-deployer-live
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and rollback contract
        run: |
          set -euo pipefail
          python3 tests/test-deployer-trigger-parity.py
          python3 -m py_compile scripts/readonly_urlopen_retry.py
          python3 tests/test-readonly-urlopen-retry.py -v
          php -l advisor-existing-page-release-v1.php
          php -l guarded-auto-publisher.php
          php -l na-ryby-git-publisher.php
          php tests/test-advisor-existing-page-release-v1.php
          php tests/test-native-kses-write-contract.php
          php tests/test-buyer-hub-trust-repair-v8.php
          php tests/test-production-buyer-hub-60341-v8.php
          php tests/test-echolot-budget-118455-v8.php
          php tests/test-echolot-pillar-118553-v8.php
          php tests/test-alarm-guide-trust-118218-v8.php
          php tests/test-alarm-score-cleanup-118218-v8.php
          php tests/test-buyer-source-proof.php
          php -l buyer-click-telemetry-v1.php
          php tests/test-buyer-click-telemetry-v1.php
          node --check assets/nry-buyer-clicks-v1.js
          node tests/test-buyer-click-telemetry-v1.mjs
          php tests/test-three-chair-guides-v8.php
          php tests/test-evergreen-chair-v8.php
          php -l guarded-auto-publisher.php
          php -l seo-snippet-pilot.php
          php -l seo-pipaky-beginner-35755-v1.php
          php -l seo-pipaky-advanced-description-36702-v1.php
          php tests/test-pipaky-beginner-serp-35755-v1.php
          php tests/test-pipaky-diagnostics-35755-v8.php
          php tests/test-pipaky-advanced-36702-v8.php
          php tests/test-pipaky-42401-quick-choice-v8.php
          php tests/test-pipaky-36702-five-price-fix-v8.php
          php tests/test-pipaky-advanced-description-36702-v1.php
          php -l checklist-release-v1.php
          php tests/guarded-auto-publisher-contract.php
          php tests/test-v5-native-release.php
          php tests/test-v6-chair-native-release.php
          php tests/test-v7-chair-native-release.php
          php tests/test-v8-generic-auto-release.php
          python3 tests/test-auto-public-readback.py -v
          python3 tests/test-42401-public-semantic.py
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.NRY_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: na-ryby-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed repository checkout is present before guarded release
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f na-ryby-git-publisher.php
          test -f RELEASE_INTEGRITY.json
          echo 'PASS: reviewed release files checked out; no credentials persisted'
      - name: Validate exact approved Deployer destination
        env:
          NRY_DFG_DEPLOY_URL: ${{ secrets.NRY_DFG_DEPLOY_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlparse, parse_qs
          secret_url=os.environ.get("NRY_DFG_DEPLOY_URL","")
          p=urlparse(secret_url)
          q=parse_qs(p.query)
          valid=(p.scheme=="https" and p.netloc=="na-ryby.eu"
                 and p.path=="/wp-json/dfg/v1/package_update"
                 and q.get("type")==["plugin"]
                 and q.get("package")==["na-ryby-git-publisher"]
                 and len(q.get("secret",[]))==1 and bool(q["secret"][0])
                 and not p.username and not p.password and not p.fragment)
          if not valid:
              print("BLOCKED: Deployer URL secret is missing or points outside exact approved target")
              sys.exit(1)
          print("Approved site, plugin slug and Deployer endpoint verified")
          PY
      - name: Request WordPress Deployer pull of reviewed main
        env:
          NRY_DFG_DEPLOY_URL: ${{ secrets.NRY_DFG_DEPLOY_URL }}
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error --max-time 75 --max-redirs 0 \
            --output /tmp/nry-deployer-response.json \
            --write-out '%{http_code}' "$NRY_DFG_DEPLOY_URL")"
          echo "Deployer HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
              echo "BLOCKED: Deployer request did not receive HTTP 200. Inspect private WordPress deployment logs."
              exit 1
          fi
          echo "Deployer request accepted; LIVE code state and WordPress post writes NOT yet verified."


      - name: Confirm active WordPress publisher and one-shot SHA-bound update
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import json,os,time,urllib.request
          base='https://na-ryby.eu/poradce-vybavy/'
          for attempt in range(5):
              url=base+'?nry_release_health=1&run='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NaRybyReleaseHealth/1.0'})
                  with guarded_urlopen(req,timeout=25) as resp:
                      raw=resp.read(4096)
                      health=json.loads(raw)
                  result={k:health.get(k) for k in ('publisher_version','auto_status','source_matches',
                      'candidate_matches','backup_present','guarded_publisher_enabled',
                      'last_auto_batch_id','last_auto_receipt_status','last_auto_stop_reason')}
                  print('LIVE HEALTH:',json.dumps(result,sort_keys=True))
                  if health.get('publisher_version')=='0.16.0' and health.get('candidate_matches') is True \
                      and health.get('backup_present') is True \
                      and health.get('auto_status') in ('auto_applied_local_verified_pending_public_browser',
                          'recovered_local_verified_pending_public_browser',
                          'recovered_already_exact_no_write'):
                      print('PASS: exact source and candidate verified on live WordPress')
                      break
              except Exception as e:
                  print('Live WordPress health unavailable:',type(e).__name__)
              if attempt==4: raise SystemExit('BLOCKED: WordPress v0.16 source-bound publisher not independently confirmed')
              time.sleep(5)
          PY


      - name: Exact beginner pípáky WordPress source SHA and current Yoast hashes (GET only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import json,re,urllib.request
          url='https://na-ryby.eu/poradce-vybavy/?nry_pipaky_beginner_source_proof=1'
          request=urllib.request.Request(url,headers={
              'Cache-Control':'no-cache','User-Agent':'NaRyby-Beginner-Serp-SourceReadOnly/1.0'})
          with guarded_urlopen(request,timeout=25) as response:
              assert response.status==200
              proof=json.loads(response.read(9000))
          assert proof['data_class']=='HASH_AND_MODIFIED_GMT_ONLY_NO_POST_CONTENT'
          assert proof['publication_authorized'] is False and proof['wordpress_writes']==0
          assert proof['gsc_protection_checked'] is False
          assert len(proof['rows'])==1
          row=proof['rows'][0]
          assert row['id']==35755 and row['state']=='SOURCE_SHA_AVAILABLE_NOT_PUBLICATION_AUTHORITY'
          assert row['slug']=='pipaky-na-ryby-prakticke-rady-pro-zacatecniky'
          for key in ('source_sha256','raw_yoast_title_sha256','raw_yoast_description_sha256'):
              assert re.fullmatch('[a-f0-9]{64}',row[key]),key
          assert 1000<row['source_bytes']<160000
          assert row['raw_yoast_title_bytes']<500 and row['raw_yoast_description_bytes']<1000
          assert re.fullmatch('20[0-9]{2}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}',
              row['source_modified_gmt'])
          print('BEGINNER_SERP_SOURCE_PROOF',json.dumps(row,sort_keys=True))
          PY

      - name: Confirm exact one-time beginner Yoast metadata and live HTML SERP (read only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import html,json,re,time,urllib.request
          from hashlib import sha256
          from html.parser import HTMLParser
          host='https://na-ryby.eu'
          expected_title='Pípák na ryby pro začátečníky: nastavení bez chyb'
          expected_description=('První pípák na ryby? Jak nastavit citlivost a hlasitost, '
             'uložit prut, poznat falešný poplach a otestovat signalizátor '
             'před nahozením. Praktický postup.')
          expected_canonical=(host+'/pipaky-na-ryby-prakticke-rady-pro-zacatecniky/')
          # Independent public/WordPress proof run 42365660451: guarded
          # one-post 35755 diagnosis was applied and publicly verified.
          # Keep this post's exact CURRENT content fingerprint pinned for
          # every next manifest batch, rather than switching to stale
          # pre-release 14984-byte evidence on an unrelated new release.
          expected_source='d4a35b7772708fe47dec76c6d023f1f6b39d0acc443fa160d60ab9dafd390016'
          expected_bytes=17459
          expected_modified_gmt='2026-11-07 10:51:04'
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache',
                   'User-Agent':'NaRyby-OneShotBeginnerSeoPublicReadback/1.0'})
              with guarded_urlopen(req,timeout=20) as resp:
                  assert resp.status==200
                  return resp.read(1000000).decode('utf8')
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__();self.in_title=False;self.title=[];self.description=None;self.canonical=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title':self.in_title=True
                  if tag=='meta' and (a.get('name') or '').lower()=='description':
                      self.description=a.get('content')
                  if tag=='link' and 'canonical' in (a.get('rel') or '').lower().split():
                      self.canonical=a.get('href')
              def handle_endtag(self,tag):
                  if tag=='title':self.in_title=False
              def handle_data(self,value):
                  if self.in_title:self.title.append(value)
          for attempt in range(4):
              try:
                  doc=json.loads(get(host+'/poradce-vybavy/?nry_pipaky_beginner_source_proof=1'))
                  assert doc['wordpress_writes']==0 and doc['publication_authorized'] is False
                  assert len(doc['rows'])==1
                  row=doc['rows'][0]
                  assert row['id']==35755 and row['slug']=='pipaky-na-ryby-prakticke-rady-pro-zacatecniky'
                  assert row['source_sha256']==expected_source
                  assert row['source_bytes']==expected_bytes
                  assert row['source_modified_gmt']==expected_modified_gmt
                  assert row['raw_yoast_title_exists'] is True
                  assert row['raw_yoast_description_exists'] is True
                  assert row['raw_yoast_title_sha256']==sha256(expected_title.encode()).hexdigest()
                  assert row['raw_yoast_description_sha256']==sha256(expected_description.encode()).hexdigest()
                  page=Head()
                  page.feed(get(expected_canonical+'?nry_serp_public_verify=20261104'))
                  assert expected_title in html.unescape(''.join(page.title))
                  assert html.unescape(page.description or '')==expected_description
                  assert html.unescape(page.canonical or '')==expected_canonical
                  print('BEGINNER_SERP_PROD_VERIFIED',json.dumps({
                    'post_id':35755,'source_sha256':row['source_sha256'],
                    'yoast_title':expected_title,'yoast_description':expected_description,
                    'canonical':page.canonical,'status':'PUBLIC_META_AND_SOURCE_VERIFIED'
                  },ensure_ascii=False))
                  break
              except Exception as e:
                  print('BEGINNER_SERP_RETRY',type(e).__name__,attempt+1)
                  if attempt==3:raise SystemExit('BLOCKED: exact beginner Yoast metadata not verified on public website')
                  time.sleep(5)
          PY

      - name: Read-only exact live source and Yoast hashes for broad pípáky guide #42401
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import json,re,urllib.request
          from hashlib import sha256
          url='https://na-ryby.eu/poradce-vybavy/?nry_pipaky_main_source_proof=1'
          req=urllib.request.Request(url,headers={
            'Cache-Control':'no-cache,no-store',
            'User-Agent':'NaRyby-PipakyMain-SourceHashOnly/1.0'})
          with guarded_urlopen(req,timeout=25) as res:
              assert res.status==200
              proof=json.loads(res.read(9000))
          assert proof['site']=='https://na-ryby.eu'
          assert proof['data_class']=='HASH_AND_MODIFIED_GMT_ONLY_NO_POST_CONTENT'
          assert proof['publication_authorized'] is False
          assert proof['wordpress_writes']==0
          assert len(proof['rows'])==1
          row=proof['rows'][0]
          assert row['id']==42401
          assert row['slug']=='jednoduchy-navod-jak-vyuzivat-pipaky-na-ryby-vetsinou-ucinne'
          assert row['state']=='SOURCE_SHA_AVAILABLE_NOT_PUBLICATION_AUTHORITY'
          # The 42401 content batch was actually written by WordPress BEFORE
          # this diagnostic runs. Checking the PRE-edit SHA here would always
          # reject the legitimate new content after an exact batch success.
          # Scope the single transition to the current frozen 42401 manifest,
          # verified native WP local receipt and candidate readback. New hash
          # is printed below and MUST be permanently repinned afterward.
          prior_source='7f3b1fa8073d4167cdd770c6d869044be07d3db4d54884306a50cd0bbe6681f8'
          prior_modified='2026-10-23 06:34:54'
          with open('manifest.json',encoding='utf8') as f: current=json.load(f)
          reviewed_transition=(
              current.get('schema_version')==8
              and current.get('batch_id')=='pipaky-42401-quick-choice-router-20261107-v1'
              and len(current.get('edits',[]))==1
              and current['edits'][0].get('post_id')==42401
              and current['edits'][0].get('edit_id')=='pipaky-navod-42401-quick-choice-20261107-v1'
              and current['edits'][0].get('source_sha256')==prior_source
              and current['edits'][0].get('source_modified_gmt')==prior_modified
          )
          if reviewed_transition:
              # This GET reports a server-side SHA/backup/candidate verification;
              # it is NOT public HTML/visitor proof or fresh write authority.
              health_req=urllib.request.Request(
                  'https://na-ryby.eu/poradce-vybavy/?nry_release_health=1',
                  headers={'Cache-Control':'no-cache,no-store',
                           'User-Agent':'Nry42401OneBatchPostWriteReadOnly/1.0'})
              with guarded_urlopen(health_req,timeout=25) as hres:
                  assert hres.status==200
                  health=json.loads(hres.read(4096))
              assert health.get('publisher_version')=='0.16.0'
              assert health.get('last_auto_batch_id')==current['batch_id']
              assert health.get('last_auto_receipt_status')=='applied_and_verified_local'
              assert health.get('candidate_matches') is True
              assert health.get('source_matches') is False
              assert health.get('backup_present') is True
              assert health.get('guarded_publisher_enabled') is True
              assert row['source_sha256']!=prior_source
              assert row['source_modified_gmt']>prior_modified
              assert 5000 < row['source_bytes'] < 100000
              print('PIPAKY_MAIN_EXACT_POST_WRITE_SOURCE_REPIN_REQUIRED',json.dumps({
                  'source_sha256':row['source_sha256'],
                  'source_bytes':row['source_bytes'],
                  'source_modified_gmt':row['source_modified_gmt'],
                  'last_auto_batch_id':health['last_auto_batch_id'],
                  'last_auto_receipt_status':health['last_auto_receipt_status'],
                  'wordpress_writes_by_read_only_check':0},sort_keys=True))
          else:
              # All other releases stay pinned to the exact former source
              # until the new post-write SHA is permanently source-locked.
              assert row['source_sha256']==prior_source
              assert row['source_modified_gmt']==prior_modified
              assert 5000 < row['source_bytes'] < 100000
          for field in ('raw_yoast_title_sha256','raw_yoast_description_sha256'):
              assert re.fullmatch('[a-f0-9]{64}',row[field])
          assert row['raw_yoast_title_exists'] is True
          assert row['raw_yoast_description_exists'] is True
          assert row['raw_yoast_title_sha256']==sha256(
              'Pípáky na ryby: jak vybrat, nastavit a používat'.encode('utf8')).hexdigest()
          assert row['raw_yoast_description_sha256']==sha256(
              'Pípáky na ryby jednoduše: jak nastavit citlivost, kam hlásič umístit a kdy se vyplatí příposlech. Praktické rady i výběr správné sady.'.encode('utf8')).hexdigest()
          print('PIPAKY_MAIN_CURRENT_SHA_ONLY',json.dumps({
             'id':row['id'],'slug':row['slug'],'source_sha256':row['source_sha256'],
             'source_bytes':row['source_bytes'],'modified_gmt':row['source_modified_gmt'],
             'yoast_title_sha256':row['raw_yoast_title_sha256'],
             'yoast_description_sha256':row['raw_yoast_description_sha256'],
             'wordpress_writes':0,'release_authorized':False},sort_keys=True))
          PY

      - name: Public read-only exact source and Yoast digests for professional pípáky #36702
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import json,re,urllib.request
          # Independent live proof from successful protected publication run
          # 42367935285: use exact CURRENT post-36702 source for all future
          # batches; no special approval based on a transient batch ID.
          # Exact new SOURCE state independently verified after guarded
          # five-price publication, run 42376437883 and read-only GSC #1440.
          # No future release may fall back to the old 12938-byte document.
          expected_source='94c3683902bee004fc136c12004ecde138509bc3a9346df0b095286f781e10cd'
          expected_bytes=13069
          expected_modified_gmt='2026-11-07 13:19:54'
          url='https://na-ryby.eu/poradce-vybavy/?nry_pipaky_professional_source_proof=1'
          req=urllib.request.Request(url,headers={
              'Cache-Control':'no-cache,no-store',
              'User-Agent':'NaRyby-Professional-Pipaky-SHA-Only/1.0'})
          with guarded_urlopen(req,timeout=25) as response:
              assert response.status==200
              result=json.loads(response.read(9000))
          assert result['data_class']=='HASH_AND_MODIFIED_GMT_ONLY_NO_POST_CONTENT'
          assert result['site']=='https://na-ryby.eu'
          assert result['publication_authorized'] is False
          assert result['wordpress_writes']==0
          assert result['gsc_protection_checked'] is False
          assert len(result['rows'])==1
          row=result['rows'][0]
          assert row['id']==36702
          assert row['slug']=='pipaky-na-ryby-pro-profesionaly-prehled-nejlepsich-znacek-a-modelu'
          assert row['state']=='SOURCE_SHA_AVAILABLE_NOT_PUBLICATION_AUTHORITY'
          assert row['source_sha256']==expected_source
          assert row['source_bytes']==expected_bytes
          assert row['source_modified_gmt']==expected_modified_gmt
          assert len(row.get('legacy_price_raw_literal_counts',{}))==5
          assert all(v==0 for v in row['legacy_price_raw_literal_counts'].values())
          assert len(row.get('legacy_price_safe_plain_counts',{}))==5
          assert all(v==0 for v in row['legacy_price_safe_plain_counts'].values())
          for field in ('source_sha256','raw_yoast_title_sha256','raw_yoast_description_sha256'):
              assert re.fullmatch('[a-f0-9]{64}',row[field]),field
          assert row['raw_yoast_title_exists'] is False
          assert row['raw_yoast_title_bytes']==0
          assert row['raw_yoast_title_sha256']=='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
          assert row['raw_yoast_description_exists'] is True
          from hashlib import sha256
          from html.parser import HTMLParser
          from html import unescape
          from time import sleep
          expected_meta=('Pípáky pro pokročilé: kdy se vyplatí příposlech, '
              'jak ověřit párování, ochranu před deštěm a kompatibilitu '
              'starší sady. Konkrétní kontrolní kroky před nákupem.')
          expected_digest=sha256(expected_meta.encode('utf8')).hexdigest()
          canonical='https://na-ryby.eu/pipaky-na-ryby-pro-profesionaly-prehled-nejlepsich-znacek-a-modelu/'
          class PageHead(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.description=None
                  self.canonical=None
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=='meta' and (attrs.get('name') or '').lower()=='description':
                      self.description=attrs.get('content')
                  if tag=='link' and 'canonical' in (attrs.get('rel') or '').lower().split():
                      self.canonical=attrs.get('href')
          for attempt in range(4):
              try:
                  if attempt:
                      with guarded_urlopen(req,timeout=25) as response:
                          assert response.status==200
                          obj=json.loads(response.read(9000))
                          assert len(obj['rows'])==1
                          row=obj['rows'][0]
                  assert row['raw_yoast_description_sha256']==expected_digest
                  assert row['raw_yoast_description_bytes']==len(expected_meta.encode('utf8'))
                  page=urllib.request.Request(
                      canonical+'?nry_professional_meta_public_proof=20261107',
                      headers={'Cache-Control':'no-cache,no-store',
                               'User-Agent':'NaRyby-Professional-Pipaky-Meta-Proof/1.0'})
                  with guarded_urlopen(page,timeout=25) as response:
                      assert response.status==200
                      body=response.read(400000).decode('utf8')
                  html=PageHead()
                  html.feed(body)
                  assert unescape(html.description or '')==expected_meta
                  assert unescape(html.canonical or '')==canonical
                  break
              except Exception as error:
                  print('ADVANCED_PIPAKY_META_RETRY',type(error).__name__,attempt+1)
                  if attempt==3:
                      raise SystemExit('BLOCKED: exact source/meta or public canonical not verified')
                  sleep(3)
          counts=row.get('legacy_price_raw_literal_counts')
          safe=row.get('legacy_price_safe_plain_counts')
          external=row.get('legacy_external_host_literal_counts')
          assert isinstance(counts,dict) and isinstance(safe,dict)
