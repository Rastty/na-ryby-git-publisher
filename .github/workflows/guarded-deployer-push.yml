name: Na-Ryby Guarded Deployer Push-to-Deploy
on:
  pull_request:
    paths:
      - 'manifest.json'
      - 'advisor-existing-page-release-v1.php'
      - 'guarded-auto-publisher.php'
      - 'tests/test-native-kses-write-contract.php'
      - 'tests/test-three-chair-guides-v8.php'
      - 'tests/test-buyer-source-proof.php'
      - 'tests/test-advisor-existing-page-release-v1.php'
      - 'na-ryby-git-publisher.php'
      - 'guarded-auto-publisher.php'
      - '.github/workflows/guarded-deployer-push.yml'
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'advisor-existing-page-release-v1.php'
      - 'guarded-auto-publisher.php'
      - 'tests/test-three-chair-guides-v8.php'
      - 'tests/test-buyer-source-proof.php'
      - 'tests/test-advisor-existing-page-release-v1.php'
      - 'na-ryby-git-publisher.php'
      - 'guarded-auto-publisher.php'
      - 'seo-snippet-pilot.php'
      - 'checklist-release-v1.php'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nry-guarded-deployer-live
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and rollback contract
        run: |
          set -euo pipefail
          php -l advisor-existing-page-release-v1.php
          php -l guarded-auto-publisher.php
          php -l na-ryby-git-publisher.php
          php tests/test-advisor-existing-page-release-v1.php
          php tests/test-native-kses-write-contract.php
          php tests/test-buyer-source-proof.php
          php tests/test-three-chair-guides-v8.php
          php -l guarded-auto-publisher.php
          php -l seo-snippet-pilot.php
          php -l checklist-release-v1.php
          php tests/guarded-auto-publisher-contract.php
          php tests/test-v5-native-release.php
          php tests/test-v6-chair-native-release.php
          php tests/test-v7-chair-native-release.php
          php tests/test-v8-generic-auto-release.php
          python3 tests/test-auto-public-readback.py -v
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.NRY_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: na-ryby-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed repository checkout is present before guarded release
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f na-ryby-git-publisher.php
          test -f RELEASE_INTEGRITY.json
          echo 'PASS: reviewed release files checked out; no credentials persisted'
      - name: Validate exact approved Deployer destination
        env:
          NRY_DFG_DEPLOY_URL: ${{ secrets.NRY_DFG_DEPLOY_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlparse, parse_qs
          secret_url=os.environ.get("NRY_DFG_DEPLOY_URL","")
          p=urlparse(secret_url)
          q=parse_qs(p.query)
          valid=(p.scheme=="https" and p.netloc=="na-ryby.eu"
                 and p.path=="/wp-json/dfg/v1/package_update"
                 and q.get("type")==["plugin"]
                 and q.get("package")==["na-ryby-git-publisher"]
                 and len(q.get("secret",[]))==1 and bool(q["secret"][0])
                 and not p.username and not p.password and not p.fragment)
          if not valid:
              print("BLOCKED: Deployer URL secret is missing or points outside exact approved target")
              sys.exit(1)
          print("Approved site, plugin slug and Deployer endpoint verified")
          PY
      - name: Request WordPress Deployer pull of reviewed main
        env:
          NRY_DFG_DEPLOY_URL: ${{ secrets.NRY_DFG_DEPLOY_URL }}
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error --max-time 75 --max-redirs 0 \
            --output /tmp/nry-deployer-response.json \
            --write-out '%{http_code}' "$NRY_DFG_DEPLOY_URL")"
          echo "Deployer HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
              echo "BLOCKED: Deployer request did not receive HTTP 200. Inspect private WordPress deployment logs."
              exit 1
          fi
          echo "Deployer request accepted; LIVE code state and WordPress post writes NOT yet verified."


      - name: Confirm active WordPress publisher and one-shot SHA-bound update
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          base='https://na-ryby.eu/poradce-vybavy/'
          for attempt in range(5):
              url=base+'?nry_release_health=1&run='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NaRybyReleaseHealth/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      raw=resp.read(4096)
                      health=json.loads(raw)
                  result={k:health.get(k) for k in ('publisher_version','auto_status','source_matches',
                      'candidate_matches','backup_present','guarded_publisher_enabled')}
                  print('LIVE HEALTH:',json.dumps(result,sort_keys=True))
                  if health.get('publisher_version')=='0.16.0' and health.get('candidate_matches') is True \
                      and health.get('backup_present') is True \
                      and health.get('auto_status') in ('auto_applied_local_verified_pending_public_browser',
                          'recovered_local_verified_pending_public_browser',
                          'recovered_already_exact_no_write'):
                      print('PASS: exact source and candidate verified on live WordPress')
                      break
              except Exception as e:
                  print('Live WordPress health unavailable:',type(e).__name__)
              if attempt==4: raise SystemExit('BLOCKED: WordPress v0.16 source-bound publisher not independently confirmed')
              time.sleep(5)
          PY


      - name: GET-only private-source SHA fingerprints for three explicit buyer guides
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request
          url="https://na-ryby.eu/poradce-vybavy/?nry_buyer_source_proof=1"
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache',
              'User-Agent':'NaRybySourceProofReadOnly/1.0'})
          with urllib.request.urlopen(req,timeout=30) as resp:
              assert resp.status==200
              document=json.loads(resp.read(10000))
          assert document['publisher_version']=='0.16.0'
          assert document['data_class']=='HASH_AND_MODIFIED_GMT_ONLY_NO_POST_CONTENT'
          assert document['publication_authorized'] is False
          assert document['wordpress_writes']==0
          rows=document['rows']
          assert [x['id'] for x in rows]==[34858,34953,34969]
          for x in rows:
              assert x['state']=='SOURCE_SHA_AVAILABLE_NOT_PUBLICATION_AUTHORITY',x
              assert re.fullmatch(r'[0-9a-f]{64}',x['source_sha256'])
              assert re.fullmatch(r'20\d\d-\d\d-\d\d \d\d:\d\d:\d\d',x['source_modified_gmt'])
              assert 1000<x['source_bytes']<350000
              print('SOURCE_PROOF',
                  json.dumps({k:x[k] for k in ('id','slug','source_modified_gmt','source_bytes','source_sha256')},
                  sort_keys=True))
          print('PASS: exact current raw WordPress source hash only; no editorial publication')
          PY


      - name: Public GET-only immutable source fingerprint for exact evergreen buyer hub
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request
          url='https://na-ryby.eu/poradce-vybavy/?nry_evergreen_source_proof=1'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache',
              'User-Agent':'NaRybyEvergreenSourceOnly/1.0'})
          with urllib.request.urlopen(req,timeout=30) as response:
              assert response.status==200
              doc=json.loads(response.read(7000))
          assert doc['publisher_version']=='0.16.0'
          assert doc['data_class']=='HASH_AND_MODIFIED_GMT_ONLY_NO_POST_CONTENT'
          assert doc['publication_authorized'] is False and doc['wordpress_writes']==0
          assert doc['gsc_protection_checked'] is False
          rows=doc['rows']
          assert len(rows)==1 and rows[0]['id']==11901
          row=rows[0]
          assert row['slug']=='jak-vybrat-rybarske-kreslo'
          assert row['state']=='SOURCE_SHA_AVAILABLE_NOT_PUBLICATION_AUTHORITY'
          assert re.fullmatch(r'[0-9a-f]{64}',row['source_sha256'])
          assert re.fullmatch(r'20\d\d-\d\d-\d\d \d\d:\d\d:\d\d',row['source_modified_gmt'])
          assert 1000 < row['source_bytes'] < 350000
          print('EVERGREEN_SOURCE_PROOF',json.dumps({
              k:row[k] for k in ('id','slug','source_modified_gmt','source_bytes','source_sha256')
          },sort_keys=True))
          print('PASS: one exact, current, raw WordPress source hash; zero editorial writes')
          PY

      - name: Assert approved V8 batch genuinely committed in WordPress before success
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,time
          with open('manifest.json',encoding='utf8') as f: manifest=json.load(f)
          if manifest.get('schema_version')!=8:
              print('SKIP: no V8 buyer content manifest in current release')
              raise SystemExit(0)
          expected=manifest['batch_id']
          for attempt in range(5):
              req=urllib.request.Request('https://na-ryby.eu/poradce-vybavy/?nry_release_health=1&buyer_batch='+str(attempt),
                 headers={'Cache-Control':'no-cache','User-Agent':'NryExactNativeBatchReadback/1.0'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  health=json.loads(response.read(4096))
              print('BATCH_READBACK',json.dumps({
                  'expected_batch':expected,'current_batch':health.get('last_auto_batch_id'),
                  'status':health.get('last_auto_receipt_status'),
                  'publisher_version':health.get('publisher_version')},sort_keys=True))
              if (health.get('publisher_version')=='0.16.0'
                  and health.get('last_auto_batch_id')==expected
                  and health.get('last_auto_receipt_status')=='applied_and_verified_local'):
                  print('PASS: full reviewed V8 batch committed, local SHA readback complete')
                  break
              if attempt==4:
                  raise SystemExit('BLOCKED: reviewed V8 batch not committed in WordPress')
              time.sleep(5)
          PY

      - name: Trigger exact source-pinned advisor release and verify public code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time,urllib.request
          marker=b'nry-expired-offer-hard-stop-v1'
          base='https://na-ryby.eu/poradce-vybavy/'
          for attempt in range(4):
              url=base+'?nry_direct_release_readback='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
              request=urllib.request.Request(url,headers={
                  'Cache-Control':'no-cache,no-store','Pragma':'no-cache',
                  'User-Agent':'NaRybyGuardedReleaseProbe/1.0'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      body=response.read(750000)
                      if response.status==200 and marker in body:
                          print('PASS: public advisor contains exact expiry hard-stop marker')
                          break
                      print('Not yet visible: HTTP',response.status,'marker',marker in body)
              except Exception as e:
                  print('Readback unavailable:',type(e).__name__)
              if attempt==3:
                  raise SystemExit('BLOCKED: public advisor hard-stop not independently visible')
              time.sleep(5)
          PY

