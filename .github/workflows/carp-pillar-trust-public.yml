name: Na-Ryby Carp Pillar Public Trust Readback
on:
  pull_request:
    paths:
      - 'carp-pillar-trust-cleanup-118541-v1.php'
      - 'tests/test-carp-pillar-trust-118541.php'
      - 'scripts/verify-carp-pillar-118541-public.py'
      - '.github/workflows/carp-pillar-trust-public.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline contract checks
        run: |
          php -l carp-pillar-trust-cleanup-118541-v1.php
          php tests/test-carp-pillar-trust-118541.php
          python3 -m py_compile scripts/verify-carp-pillar-118541-public.py
      - name: Public semantic GET-only proof
        if: github.event_name != 'pull_request'
        run: python3 scripts/verify-carp-pillar-118541-public.py
