name: Na-Ryby Baitboat V3 Photo and Neutral-Start Contract
on:
  pull_request:
    paths:
      - 'assets/baitboat-picker-v3.html'
      - 'assets/baitboat-photo-provenance-v1.json'
      - 'baitboat-release-v3.php'
      - 'tests/test-baitboat-landing-v3.cjs'
      - 'tests/test-baitboat-mobile-v3.mjs'
      - 'na-ryby-git-publisher.php'
      - '.github/workflows/baitboat-v3-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: php -l baitboat-release-v3.php && php -l na-ryby-git-publisher.php
      - run: node tests/test-baitboat-landing-v3.cjs
      - run: python3 -m py_compile scripts/verify-baitboat-live-v2.py
  mobile:
    runs-on: ubuntu-24.04
    needs: offline
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-baitboat-mobile-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baitboat-v3-mobile-evidence
          path: artifacts/baitboat-v3-*.png
          if-no-files-found: ignore
          retention-days: 14
