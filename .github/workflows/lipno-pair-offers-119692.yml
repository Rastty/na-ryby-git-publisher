name: Na-Ryby Lipno Pair 119692 Visible Offers Public Proof
on:
  pull_request:
    paths:
      - 'na-ryby-git-publisher.php'
      - 'lipno-pair-offers-119692-v1.php'
      - 'tests/test-lipno-pair-offers-119692-v1.php'
      - 'scripts/verify-lipno-pair-offers-public-119692.py'
      - 'tests/test-lipno-pair-offers-public-119692.py'
      - '.github/workflows/lipno-pair-offers-119692.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Source pin, placement, URLs and guarded path contracts
        run: |
          php -l na-ryby-git-publisher.php
          php -l lipno-pair-offers-119692-v1.php
          php tests/test-lipno-pair-offers-119692-v1.php
          python3 -m py_compile scripts/verify-lipno-pair-offers-public-119692.py
          python3 tests/test-lipno-pair-offers-public-119692.py
          python3 tests/test-deployer-trigger-parity.py
  public:
    needs: contract
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: GET-only original-source preflight or deployed visible offers readback
        env:
          PHASE: ${{ github.event_name == 'pull_request' && 'preflight' || 'verify' }}
        run: python3 scripts/verify-lipno-pair-offers-public-119692.py --"${PHASE}"
