name: Na-Ryby boat capacity buyer check
on:
  pull_request:
    paths:
      - 'boat-load-check-119598-v1.php'
      - 'assets/nry-boat-load-v1.js'
      - 'na-ryby-git-publisher.php'
      - 'tests/test-boat-load-check-119598-v1.php'
      - 'tests/test-boat-load-check-v1.cjs'
      - 'scripts/verify-boat-load-check-public.py'
      - '.github/workflows/boat-load-check-v1.yml'
  push:
    branches: [main]
    paths:
      - 'boat-load-check-119598-v1.php'
      - 'assets/nry-boat-load-v1.js'
      - 'na-ryby-git-publisher.php'
      - 'tests/test-boat-load-check-119598-v1.php'
      - 'tests/test-boat-load-check-v1.cjs'
      - 'scripts/verify-boat-load-check-public.py'
      - '.github/workflows/boat-load-check-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-site-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PHP, JavaScript and source invariants
        run: |
          php -l boat-load-check-119598-v1.php
          php -l tests/test-boat-load-check-119598-v1.php
          php -l na-ryby-git-publisher.php
          php tests/test-boat-load-check-119598-v1.php
          node tests/test-boat-load-check-v1.cjs
      - name: GET-only public baseline preflight
        run: python3 scripts/verify-boat-load-check-public.py
