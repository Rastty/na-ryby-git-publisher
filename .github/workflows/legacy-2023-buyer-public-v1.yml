name: Na-Ryby Six Legacy 2023 Buyer Cards Live Proof
on:
  pull_request:
    paths:
      - 'legacy-2023-buyer-rescue-v1.php'
      - 'assets/nry-legacy-2023-buyer-click-v1.js'
      - 'tests/test-legacy-2023-buyer-rescue-v1.php'
      - 'scripts/verify-legacy-2023-buyer-public-v1.py'
      - 'na-ryby-git-publisher.php'
      - '.github/workflows/legacy-2023-buyer-public-v1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-legacy-2023-buyer-public-v1.py'
      - '.github/workflows/legacy-2023-buyer-public-v1.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: nry-legacy-2023-six-proof-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Six frontend source guards and 18 guides (minimal)
        run: |
          set -euo pipefail
          php -l legacy-2023-buyer-rescue-v1.php
          php tests/test-legacy-2023-buyer-rescue-v1.php
          node --check assets/nry-legacy-2023-buyer-click-v1.js
          python3 -m py_compile scripts/verify-legacy-2023-buyer-public-v1.py
      - name: Six publicly deployed legacy article cards (GET only; no clicks)
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify-legacy-2023-buyer-public-v1.py --verify
  public:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher')
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require actual protected FTPS deploy SUCCESS of this exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # This main push changes only verifier files. Runtime is still
            # the already-proven FTPS release from PR #389.
            # checkout defaults to depth=1; fetch the explicitly attested
            # runtime SHA before comparing its immutable plugin bytes.
            git fetch --no-tags --depth=1 origin 4b052dc8ad0a1d82158dfba1e615d250ea21665d
            for f in legacy-2023-buyer-rescue-v1.php assets/nry-legacy-2023-buyer-click-v1.js na-ryby-git-publisher.php; do
              git show "4b052dc8ad0a1d82158dfba1e615d250ea21665d:$f" | cmp - "$f"
            done
            RELEASE_RUN=46055687313
          else
            test "$RELEASE_SHA" = "$GITHUB_SHA"
          fi
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')"
          test "$conclusion" = success
          echo 'PASS: actual reviewed FTPS deployment succeeded'
      - name: Exact six historic posts, 18 guide cards and served JS/CSS
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            if python3 scripts/verify-legacy-2023-buyer-public-v1.py --verify; then exit 0; fi
            if [ "$n" -lt 3 ]; then sleep 7; fi
          done
          exit 1
