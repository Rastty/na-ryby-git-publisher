name: Na-Ryby Baitboat V2 Release and Mobile Contract
on:
  pull_request:
    paths:
      - 'assets/baitboat-picker-v2.html'
      - 'baitboat-release-v2.php'
      - 'tests/test-baitboat-landing-v2.cjs'
      - 'tests/test-baitboat-mobile-v2.mjs'
      - 'na-ryby-git-publisher.php'
      - '.github/workflows/baitboat-v2-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: php -l baitboat-release-v2.php && php -l na-ryby-git-publisher.php
      - run: node tests/test-baitboat-landing-v2.cjs
  mobile:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-baitboat-mobile-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baitboat-v2-responsive-evidence
          path: artifacts/baitboat-v2-*.png
          if-no-files-found: ignore
          retention-days: 14
