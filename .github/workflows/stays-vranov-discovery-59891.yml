name: Na-Ryby Vranov Stays Hub Public Readback
on:
  pull_request:
    paths:
      - 'stays-vranov-discovery-59891-v1.php'
      - 'tests/test-stays-vranov-discovery-59891-v1.php'
      - 'scripts/verify-stays-vranov-public-59891.py'
      - '.github/workflows/stays-vranov-discovery-59891.yml'
      - 'na-ryby-git-publisher.php'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          php -l stays-vranov-discovery-59891-v1.php
          php tests/test-stays-vranov-discovery-59891-v1.php
          python3 -m py_compile scripts/verify-stays-vranov-public-59891.py
  public:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - run: |
          set -euo pipefail
          python3 scripts/verify-stays-vranov-public-59891.py
