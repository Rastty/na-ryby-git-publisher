name: Na-Ryby Wellness Srub 17536 Source and DISARMED Hauzi
on:
  pull_request:
    paths:
      - 'na-ryby-git-publisher.php'
      - 'wellness-srub-source-proof-17536-v1.php'
      - 'wellness-srub-hauzi-offer-17536-v1.php'
      - 'assets/nry-wellness-srub-hauzi-17536-v1.css'
      - 'scripts/verify-wellness-srub-source-proof-17536.py'
      - 'tests/test-wellness-srub-source-proof-17536-v1.php'
      - 'tests/test-wellness-srub-hauzi-offer-17536-v1.php'
      - 'tests/test-wellness-srub-source-proof-17536.py'
      - '.github/workflows/wellness-srub-source-and-hauzi-17536.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: GET-only raw source plus DISARMED exact-property offer
        run: |
          php -l na-ryby-git-publisher.php
          php -l wellness-srub-source-proof-17536-v1.php
          php -l wellness-srub-hauzi-offer-17536-v1.php
          php tests/test-wellness-srub-source-proof-17536-v1.php
          php tests/test-wellness-srub-hauzi-offer-17536-v1.php
          python3 tests/test-wellness-srub-source-proof-17536.py
          python3 -m py_compile scripts/verify-wellness-srub-source-proof-17536.py
  public_source:
    needs: contract
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: GET-only original WordPress source, never Hauzi merchant
        run: python3 scripts/verify-wellness-srub-source-proof-17536.py --verify
