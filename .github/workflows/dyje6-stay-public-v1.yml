name: Dyje 6 Fishing Stay Public Readback (GET only)
on:
  pull_request:
    paths:
      - 'dyje6-stay-trust-14517-v1.php'
      - 'assets/nry-dyje6-stay-trust-v1.css'
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-buyer-clicks-v1.js'
      - 'tests/test-dyje6-stay-trust-14517-v1.php'
      - 'tests/test_dyje6_stay_public.py'
      - 'tests/test-buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.mjs'
      - 'scripts/verify-dyje6-stay-public.py'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source, no synthetic clicks, public semantic fixtures
        run: |
          set -euo pipefail
          php -l dyje6-stay-trust-14517-v1.php
          php tests/test-dyje6-stay-trust-14517-v1.php
          php tests/test-buyer-click-telemetry-v1.php
          node tests/test-buyer-click-telemetry-v1.mjs
          python3 -m unittest discover -s tests -p test_dyje6_stay_public.py -v
  public_readback:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only public HTML and exact local JS, never affiliate URLs
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 scripts/verify-dyje6-stay-public.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 8; fi
          done
          exit 1
