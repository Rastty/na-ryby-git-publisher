name: Na-Ryby Sport Stays 85384 Offers And Clicks (GET only)
on:
  pull_request:
    paths:
      - 'na-ryby-git-publisher.php'
      - 'sport-stays-offers-85384-v1.php'
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-sport-stays-85384-v1.css'
      - 'assets/nry-buyer-clicks-v1.js'
      - 'tests/test-sport-stays-offers-85384-v1.php'
      - 'tests/test-sport-stays-offers-public-85384.py'
      - 'scripts/verify-sport-stays-offers-public-85384.py'
      - 'tests/test-buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.mjs'
      - '.github/workflows/sport-stays-offers-85384.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact source, HTML, approved links and genuine-click constraints
        run: |
          php -l na-ryby-git-publisher.php
          php -l sport-stays-offers-85384-v1.php
          php tests/test-sport-stays-offers-85384-v1.php
          php tests/test-buyer-click-telemetry-v1.php
          node --check assets/nry-buyer-clicks-v1.js
          node tests/test-buyer-click-telemetry-v1.mjs
          python3 tests/test-sport-stays-offers-public-85384.py
      - name: Public original page and unchanged three legacy article links
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify-sport-stays-offers-public-85384.py --preflight
  public:
    needs: contract
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Three affiliate destinations, repaired links, exact CSS and JS assets
        run: python3 scripts/verify-sport-stays-offers-public-85384.py --verify
