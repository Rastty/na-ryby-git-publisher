name: Na-Ryby Family Stays 59271 Source And Public Proof

on:
  pull_request:
    paths:
      - 'family-stays-59271-v1.php'
      - 'na-ryby-git-publisher.php'
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-buyer-clicks-v1.js'
      - 'assets/nry-family-stays-59271-v1.css'
      - 'tests/test-family-stays-59271-v1.php'
      - 'tests/test-family-stays-59271-public.py'
      - 'tests/test-buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.mjs'
      - 'scripts/verify-family-stays-59271-public.py'
      - '.github/workflows/family-stays-59271-v1.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: 'preflight before merge or independent GET-only public verification'
        type: choice
        options: [preflight, verify]
        default: verify
        required: true

permissions:
  contents: read

jobs:
  source-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact family post source and no-write contract
        run: |
          php -l family-stays-59271-v1.php
          php tests/test-family-stays-59271-v1.php
          php -l buyer-click-telemetry-v1.php
          php tests/test-buyer-click-telemetry-v1.php
          node --check assets/nry-buyer-clicks-v1.js
          node tests/test-buyer-click-telemetry-v1.mjs
          python3 -m py_compile scripts/verify-family-stays-59271-public.py
          python3 tests/test-family-stays-59271-public.py
          python3 tests/test-deployer-trigger-parity.py
  public-evidence:
    runs-on: ubuntu-latest
    needs: source-and-contract
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous WordPress identity and public readiness/readback
        env:
          RELEASE_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'preflight' }}
        run: python3 scripts/verify-family-stays-59271-public.py --"${RELEASE_PHASE}"
