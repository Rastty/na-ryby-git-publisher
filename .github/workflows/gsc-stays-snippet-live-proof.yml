name: Na-Ryby GSC Stays Snippet Live Proof (GET only)
on:
  pull_request:
    paths:
      - 'gsc-revir-stays-seo-20261120-v1.php'
      - 'tests/test-gsc-revir-stays-seo-20261120-v1.php'
      - 'scripts/verify-gsc-stays-snippets-public.py'
      - 'tests/test-gsc-stays-snippets-public.py'
      - '.github/workflows/gsc-stays-snippet-live-proof.yml'
  # Script-only corrections are GET-only and must never require a new FTPS
  # release or manual workflow dispatch.
  push:
    branches: [main]
    paths:
      - 'scripts/verify-gsc-stays-snippets-public.py'
      - 'tests/test-gsc-stays-snippets-public.py'
      - '.github/workflows/gsc-stays-snippet-live-proof.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source and private probe contract, no network
        run: |
          php -l gsc-revir-stays-seo-20261120-v1.php
          php tests/test-gsc-revir-stays-seo-20261120-v1.php
          python3 -m py_compile scripts/verify-gsc-stays-snippets-public.py
          python3 tests/test-gsc-stays-snippets-public.py
  public:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require upstream real deploy success and exact current SHA
        id: provenance
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          NRY_UPSTREAM_ID: ${{ github.event.workflow_run.id }}
          NRY_UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$NRY_UPSTREAM_SHA" = "$GITHUB_SHA" || {
            echo 'BLOCKED: source HEAD differs from verified deploy'; exit 1;
          }
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NRY_UPSTREAM_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')"
          if [ "$conclusion" != success ]; then
            echo 'SKIP: successful workflow was not a successful production deploy'
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: GET-only three-page public head versus live hook diagnostic
        if: github.event_name == 'push' || steps.provenance.outputs.deployed == 'true'
        run: python3 scripts/verify-gsc-stays-snippets-public.py --verify
