name: Na-Ryby Two Archive Stay Click Routes Public Proof
on:
  pull_request:
    paths:
      - 'legacy-stays-archive-entry-v1.php'
      - 'south-moravia-stays-archive-v1.php'
      - 'assets/nry-archive-stay-click-v1.js'
      - 'tests/test-legacy-stays-archive-entry-v1.php'
      - 'tests/test-south-moravia-stays-archive-v1.php'
      - 'tests/test-south-moravia-archive-stay-click-v1.php'
      - 'tests/test-archive-stay-click-v1.mjs'
      - 'scripts/verify-archive-stay-click-public-v1.py'
      - 'tests/test-archive-stay-click-public-v1.py'
      - '.github/workflows/archive-stay-click-public-v1.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: nry-archive-stay-click-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP, JS trusted-click negative tests and GET-only verifier contract
        run: |
          set -euo pipefail
          php -l legacy-stays-archive-entry-v1.php
          php -l south-moravia-stays-archive-v1.php
          php tests/test-legacy-stays-archive-entry-v1.php
          php tests/test-south-moravia-stays-archive-v1.php
          php tests/test-south-moravia-archive-stay-click-v1.php
          node --check assets/nry-archive-stay-click-v1.js
          node tests/test-archive-stay-click-v1.mjs
          python3 -m py_compile scripts/verify-archive-stay-click-public-v1.py
          python3 tests/test-archive-stay-click-public-v1.py
  public:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require actual protected FTPS deploy for exact current main
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          NRY_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          NRY_UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$NRY_UPSTREAM_HEAD_SHA" = "$GITHUB_SHA" || {
            echo 'BLOCKED: protected upstream SHA differs from current main'
            exit 1
          }
          result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NRY_UPSTREAM_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')"
          if [ "$result" != success ]; then
            echo 'SKIP: successful protected production deployment not observed'
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
          echo 'PASS: exact-main protected deploy succeeded'
      - name: Verify two public panels + served consent-aware JS bytes (GET only)
        if: steps.upstream.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 scripts/verify-archive-stay-click-public-v1.py --verify; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 7; fi
          done
          exit 1
