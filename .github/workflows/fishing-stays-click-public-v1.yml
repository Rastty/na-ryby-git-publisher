name: Na-Ryby Fishing Stays Click Readback (GET Only)
on:
  pull_request:
    paths:
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-buyer-clicks-v1.js'
      - 'editorial/fishing-stays-cz-20261118-recommendation-blocks.html'
      - 'scripts/verify-fishing-stays-click-public-v1.py'
      - 'tests/test-fishing-stays-click-public-v1.py'
      - '.github/workflows/fishing-stays-click-public-v1.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '22 7 * * *'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check existing measurement and source-locked stay assets
        run: |
          set -euo pipefail
          php -l buyer-click-telemetry-v1.php
          php tests/test-buyer-click-telemetry-v1.php
          node --check assets/nry-buyer-clicks-v1.js
          node tests/test-buyer-click-telemetry-v1.mjs
          python3 tests/test-fishing-stays-click-public-v1.py
      - name: Prove currently published five CTAs without clicking (PR only)
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify-fishing-stays-click-public-v1.py --preflight
  live:
    needs: contract
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact public offers and deployed local JS bytes (GET only)
        run: python3 scripts/verify-fishing-stays-click-public-v1.py --verify
