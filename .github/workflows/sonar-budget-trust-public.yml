name: Na-Ryby Sonar Budget Trust Public Readback
on:
  pull_request:
    paths:
      - 'sonar-budget-trust-118455-v1.php'
      - 'sonar-budget-owner-first-118455-v1.php'
      - 'na-ryby-git-publisher.php'
      - 'tests/test-sonar-budget-owner-first-118455-v1.php'
      - 'tests/probe-sonar-budget-owner-first-118455.php'
      - 'scripts/verify-sonar-budget-owner-first-public.py'
      - 'tests/test-sonar-budget-owner-first-public.py'
      - 'tests/test-sonar-budget-trust-118455-v1.php'
      - 'scripts/verify-sonar-budget-trust-118455-public.py'
      - 'scripts/audit-sonar-faq-schema-origin.py'
      - 'tests/test-sonar-faq-schema-origin.py'
      - 'tests/test-sonar-budget-trust-public.py'
      - '.github/workflows/sonar-budget-trust-public.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline source and public verifier contract
        run: |
          set -euo pipefail
          php -l sonar-budget-trust-118455-v1.php
          php tests/test-sonar-budget-trust-118455-v1.php
          python3 -m py_compile scripts/verify-sonar-budget-trust-118455-public.py
          python3 tests/test-sonar-budget-trust-public.py
          php -l sonar-budget-owner-first-118455-v1.php
          php tests/test-sonar-budget-owner-first-118455-v1.php
          python3 -m py_compile scripts/verify-sonar-budget-owner-first-public.py
          python3 tests/test-sonar-budget-owner-first-public.py
          python3 -m py_compile scripts/audit-sonar-faq-schema-origin.py
          python3 tests/test-sonar-faq-schema-origin.py
      - name: Exercise exact source-scoped owner handoff on public REST HTML
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f nry-budget-ephemeral.html' EXIT
          python3 - <<'PY'
          from urllib.request import Request
          from pathlib import Path
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import json
          url=('https://na-ryby.eu/wp-json/wp/v2/posts/118455'
               '?_fields=id,slug,status,link,content')
          req=Request(url,headers={'User-Agent':'NRY-BudgetOwner-PR-AnonymousRead/1.0',
                                   'Cache-Control':'no-cache, no-store'})
          with guarded_urlopen(req,timeout=25) as response:
              assert response.status==200 and response.geturl()==url
              row=json.loads(response.read(300000))
          assert row['id']==118455 and row['status']=='publish'
          assert row['slug']=='nejlepsi-echoloty-do-15-000-kc-co-realne-uvidite-za-rozumny-peniz'
          data=row['content']['rendered']
          assert isinstance(data,str) and 3000<len(data)<150000
          Path('nry-budget-ephemeral.html').write_text(data,encoding='utf8')
          PY
          php tests/probe-sonar-budget-owner-first-118455.php nry-budget-ephemeral.html
      - name: Read-only public JSON-LD origin proof on PR
        if: github.event_name == 'pull_request'
        run: python3 scripts/audit-sonar-faq-schema-origin.py
  public:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact correction appeared on public site (GET only)
        run: |
          python3 scripts/verify-sonar-budget-trust-118455-public.py
          python3 scripts/verify-sonar-budget-owner-first-public.py
