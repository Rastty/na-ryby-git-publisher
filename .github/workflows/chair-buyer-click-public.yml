name: Na-Ryby Chair Buyer Click Funnel Public Proof
on:
  pull_request:
    paths:
      - 'buyer-click-telemetry-v1.php'
      - 'assets/nry-buyer-clicks-v1.js'
      - 'tests/test-buyer-click-telemetry-v1.php'
      - 'tests/test-buyer-click-telemetry-v1.mjs'
      - 'scripts/verify-chair-buyer-click-public-v1.py'
      - 'tests/test-chair-buyer-click-public-v1.py'
      - '.github/workflows/chair-buyer-click-public.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Buyer measurement and public verifier unit contracts
        run: |
          set -euo pipefail
          php -l buyer-click-telemetry-v1.php
          php tests/test-buyer-click-telemetry-v1.php
          node --check assets/nry-buyer-clicks-v1.js
          node tests/test-buyer-click-telemetry-v1.mjs
          python3 -m py_compile scripts/verify-chair-buyer-click-public-v1.py
          python3 tests/test-chair-buyer-click-public-v1.py
      - name: Confirm original public chair buyer link surfaces (GET only)
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify-chair-buyer-click-public-v1.py --preflight
  public:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public chair HTML and exact live JS bytes (GET only)
        run: python3 scripts/verify-chair-buyer-click-public-v1.py --verify
