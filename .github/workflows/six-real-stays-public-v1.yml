name: Na-Ryby Six Real Stay Affiliate Exits Public Proof
on:
  pull_request:
    paths:
      - 'six-real-stay-offers-v1.php'
      - 'assets/nry-six-real-stay-click-v1.js'
      - 'tests/test-six-real-stay-offers-v1.php'
      - 'scripts/verify-six-real-stay-offers-public-v1.py'
      - '.github/workflows/six-real-stays-public-v1.yml'
      - 'na-ryby-git-publisher.php'
      - '.github/workflows/guarded-deployer-push.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: nry-six-real-stay-affil-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: PHP and JavaScript syntax, exact six-page merchant scope
        run: |
          set -euo pipefail
          php -l six-real-stay-offers-v1.php
          php tests/test-six-real-stay-offers-v1.php
          node --check assets/nry-six-real-stay-click-v1.js
          python3 -m py_compile scripts/verify-six-real-stay-offers-public-v1.py

  public:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'Rastty/na-ryby-git-publisher'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require actual protected FTPS deploy SUCCESS of this exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}/jobs?per_page=100" --jq '.jobs[] | select(.name=="deploy") | .conclusion')"
          test "$conclusion" = success
          echo 'PASS: protected FTPS completed for exact source main SHA'
      - name: Six true affiliate panels and twelve direct merchant exits (GET ONLY)
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            if python3 scripts/verify-six-real-stay-offers-public-v1.py --verify; then exit 0; fi
            if [ "$n" -lt 3 ]; then sleep 6; fi
          done
          exit 1
