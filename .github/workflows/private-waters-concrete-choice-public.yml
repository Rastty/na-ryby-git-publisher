name: Na-Ryby Private Waters Concrete Choice Public Proof
on:
  pull_request:
    paths:
      - 'private-waters-concrete-choice-v1.php'
      - 'assets/nry-private-waters-examples-v1.css'
      - 'tests/test-private-waters-concrete-choice-v1.php'
      - 'tests/test-private-waters-concrete-choice-public.py'
      - 'scripts/verify-private-waters-concrete-choice-public.py'
      - 'scripts/diagnose-private-waters-render-public.py'
      - 'tests/test-private-waters-render-diagnostic.py'
      - '.github/workflows/private-waters-concrete-choice-public.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Precise first-party editorial insertion offline
        run: |
          php -l private-waters-concrete-choice-v1.php
          php tests/test-private-waters-concrete-choice-v1.php
          python3 -m py_compile scripts/verify-private-waters-concrete-choice-public.py
          python3 tests/test-private-waters-concrete-choice-public.py
          python3 -m py_compile scripts/diagnose-private-waters-render-public.py
          python3 tests/test-private-waters-render-diagnostic.py
      - name: Diagnose exact live public render without writes or credential input
        if: github.event_name == 'pull_request'
        run: python3 scripts/diagnose-private-waters-render-public.py --readonly
      - name: Independent exact live five-link, CSS and DOM placement proof
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify-private-waters-concrete-choice-public.py --verify
      - name: Read-only cross-check of pending old accommodation archive proof
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 scripts/verify-legacy-stays-archive-entry-public.py --verify
      - name: Independent visitor-facing anonymous same-site proof
        if: github.event_name == 'workflow_run'
        run: python3 scripts/verify-private-waters-concrete-choice-public.py --verify
