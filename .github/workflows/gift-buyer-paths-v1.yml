name: Na-Ryby Archived Gift Buyer Paths
on:
  pull_request:
    paths:
      - 'gift-buyer-paths-v1.php'
      - 'assets/nry-gift-buyer-v1.css'
      - 'assets/nry-gift-buyer-v1.js'
      - 'tests/test-gift-buyer-paths-v1.php'
      - 'tests/test-gift-buyer-paths-v1.mjs'
      - 'tests/test-gift-public-order-v1.py'
      - 'scripts/verify-gift-buyer-paths-public.py'
  push:
    branches: [main]
    paths:
      - 'gift-buyer-paths-v1.php'
      - 'assets/nry-gift-buyer-v1.css'
      - 'assets/nry-gift-buyer-v1.js'
      - 'tests/test-gift-buyer-paths-v1.php'
      - 'tests/test-gift-buyer-paths-v1.mjs'
      - 'tests/test-gift-public-order-v1.py'
      - 'scripts/verify-gift-buyer-paths-public.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gift-first-party-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP and browser event contract
        run: |
          php -l gift-buyer-paths-v1.php
          php -l na-ryby-git-publisher.php
          php tests/test-gift-buyer-paths-v1.php
          node --check assets/nry-gift-buyer-v1.js
          node tests/test-gift-buyer-paths-v1.mjs
          python3 -m py_compile scripts/verify-gift-buyer-paths-public.py
          python3 tests/test-gift-public-order-v1.py
      - name: GET-only fresh archived source and four exact destination readback
        run: python3 scripts/verify-gift-buyer-paths-public.py
