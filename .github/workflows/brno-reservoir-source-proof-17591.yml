name: Na-Ryby Brno Reservoir 17591 Exact Source Proof (GET only)
on:
  pull_request:
    paths:
      - 'brno-reservoir-source-proof-17591-v1.php'
      - 'scripts/verify-brno-reservoir-source-proof-17591.py'
      - 'tests/test-brno-reservoir-source-proof-17591-v1.php'
      - 'tests/test-brno-reservoir-source-proof-17591.py'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Raw source identity without storing or returning article content
        run: |
          php -l na-ryby-git-publisher.php
          php -l brno-reservoir-source-proof-17591-v1.php
          php tests/test-brno-reservoir-source-proof-17591-v1.php
          python3 -m py_compile scripts/verify-brno-reservoir-source-proof-17591.py
          python3 tests/test-brno-reservoir-source-proof-17591.py
  public:
    needs: contract
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Scope legacy raw-source diagnostic to actual changed release files
        id: source_scope
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/scope-legacy-source-proof.py 'brno-reservoir-source-proof-17591-v1.php' 'scripts/verify-brno-reservoir-source-proof-17591.py' 'tests/test-brno-reservoir-source-proof-17591-v1.php' 'tests/test-brno-reservoir-source-proof-17591.py'
      - name: Anonymous GET-only original WordPress source digest
        if: steps.source_scope.outputs.run == 'true'
        run: python3 scripts/verify-brno-reservoir-source-proof-17591.py --verify
