name: Na-Ryby Auto Publisher Independent Public Readback
on:
  pull_request:
    paths:
      - 'scripts/verify-current-manifest-public.py'
      - 'tests/test-auto-public-readback.py'
      - '.github/workflows/guarded-auto-public-readback.yml'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline verification tests
        run: python3 -m unittest discover -s tests -p 'test-auto-public-readback.py' -v
      - name: Public HTTP readback of exact current manifest
        if: github.event_name != 'pull_request'
        run: python3 scripts/verify-current-manifest-public.py manifest.json
      - name: Evidence (read-only)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: naryby-auto-public-readback
          path: auto-publisher-public-readback.json
          retention-days: 14
          if-no-files-found: warn
