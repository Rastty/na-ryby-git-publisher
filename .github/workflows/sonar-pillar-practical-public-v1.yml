name: Na-Ryby Sonar Pillar Owned Device Practical Handoff Public Readback
on:
  pull_request:
    paths:
      - 'sonar-pillar-practical-handoff-118553-v1.php'
      - 'na-ryby-git-publisher.php'
      - 'tests/test-sonar-pillar-practical-handoff-118553-v1.php'
      - 'scripts/verify-sonar-pillar-practical-public-v1.py'
      - 'tests/test-sonar-pillar-practical-public-v1.py'
      - 'tests/probe-sonar-pillar-actual-render-v1.php'
      - '.github/workflows/sonar-pillar-practical-public-v1.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Bound one exact existing owned-device use case to public buyer intent
        run: |
          set -euo pipefail
          php -l sonar-pillar-practical-handoff-118553-v1.php
          php -l na-ryby-git-publisher.php
          php tests/test-sonar-pillar-practical-handoff-118553-v1.php
          python3 -m py_compile scripts/verify-sonar-pillar-practical-public-v1.py
          python3 tests/test-sonar-pillar-practical-public-v1.py
      - name: Probe source-matched transform with actual anonymous REST body (never upload body)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          from urllib.request import Request
          from pathlib import Path
          from scripts.readonly_urlopen_retry import guarded_urlopen
          import json
          url=('https://na-ryby.eu/wp-json/wp/v2/posts/118553'
            '?_fields=id,slug,status,link,modified_gmt,content')
          req=Request(url,method='GET',headers={
            'User-Agent':'NaRyby-RenderOnly-SourceDiagnostic/1.0',
            'Cache-Control':'no-cache, no-store'})
          with guarded_urlopen(req,timeout=25) as r:
            assert r.status==200
            data=json.loads(r.read(450000))
          assert data['id']==118553 and data['status']=='publish'
          assert data['slug']=='jak-vybrat-echolot-pro-rybareni-kompletni-pruvodce'
          content=data['content']['rendered']
          assert 600<len(content)<240000
          Path('nry-pillar-live-body-ephemeral.html').write_text(
              content,encoding='utf8')
          PY
          php tests/probe-sonar-pillar-actual-render-v1.php nry-pillar-live-body-ephemeral.html
          rm -f nry-pillar-live-body-ephemeral.html
      - name: Check live sonar baseline without misclassifying unrelated publisher changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # A real change to sonar code, verifier or tests must retain the
          # strict before-release gate. A different feature merely updating
          # the shared publisher loader verifies the already-live sonar route.
          base_sha="${{ github.event.pull_request.base.sha }}"
          git -c protocol.version=2 fetch --depth=1 origin "$base_sha"
          if git diff --quiet "$base_sha" HEAD -- \
              sonar-pillar-practical-handoff-118553-v1.php \
              tests/test-sonar-pillar-practical-handoff-118553-v1.php \
              tests/probe-sonar-pillar-actual-render-v1.php \
              scripts/verify-sonar-pillar-practical-public-v1.py \
              tests/test-sonar-pillar-practical-public-v1.py; then
            python3 scripts/verify-sonar-pillar-practical-public-v1.py --verify
          else
            python3 scripts/verify-sonar-pillar-practical-public-v1.py --preflight
          fi
  production:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Independently verify one new practical handoff on published sonar pillar
        run: python3 scripts/verify-sonar-pillar-practical-public-v1.py --verify
