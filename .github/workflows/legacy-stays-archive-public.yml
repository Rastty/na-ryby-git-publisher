name: Na-Ryby Legacy Stays Archive First Choice Public Proof
on:
  pull_request:
    paths:
      - 'legacy-stays-archive-entry-v1.php'
      - 'assets/nry-legacy-stays-entry-v1.css'
      - 'tests/test-legacy-stays-archive-entry-v1.php'
      - 'scripts/verify-legacy-stays-archive-entry-public.py'
      - 'tests/test-legacy-stays-archive-public.py'
      - '.github/workflows/legacy-stays-archive-public.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline exact-page identity and DOM order contracts
        run: |
          php -l legacy-stays-archive-entry-v1.php
          node --check assets/nry-archive-stay-click-v1.js
          php tests/test-legacy-stays-archive-entry-v1.php
          python3 -m py_compile scripts/verify-legacy-stays-archive-entry-public.py
          python3 tests/test-legacy-stays-archive-public.py
      - name: Independent anonymous public first-choice proof after protected FTPS
        if: github.event_name == 'workflow_run'
        run: python3 scripts/verify-legacy-stays-archive-entry-public.py --verify
