name: Na-Ryby Revir Archive Decision Entry Public Proof
on:
  pull_request:
    paths:
      - 'revir-archive-decision-entry-v1.php'
      - 'assets/nry-revir-archive-entry-v1.css'
      - 'tests/test-revir-archive-decision-entry-v1.php'
      - 'scripts/verify-revir-archive-entry-public.py'
      - 'tests/test-revir-archive-dom-order-public.py'
      - '.github/workflows/revir-archive-decision-entry-v1.yml'
  # Verification-only changes never need to trigger a new FTPS code deploy.
  # Re-run a single anonymous GET once the corrected verifier is on main.
  push:
    branches: [main]
    paths:
      - 'scripts/verify-revir-archive-entry-public.py'
      - 'tests/test-revir-archive-dom-order-public.py'
      - '.github/workflows/revir-archive-decision-entry-v1.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline PHP archive layout and fail-closed identity
        run: |
          php -l revir-archive-decision-entry-v1.php
          php tests/test-revir-archive-decision-entry-v1.php
          python3 -m py_compile scripts/verify-revir-archive-entry-public.py
          python3 tests/test-revir-archive-dom-order-public.py
      - name: Independent anonymous archive output, after protected WEDOS FTPS
        if: github.event_name == 'workflow_run' || github.event_name == 'push'
        run: python3 scripts/verify-revir-archive-entry-public.py --verify
