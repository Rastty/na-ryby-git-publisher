name: Na-Ryby Homepage P0 Independent Public Readback
on:
  pull_request:
    paths:
      - 'home-trust-cleanup-118641-v1.php'
      - 'receiver-trust-46573-v1.php'
      - 'scripts/verify-receiver-46573-public.py'
      - 'scripts/verify-home-118641-public.py'
      - '.github/workflows/nry-home-public-readback.yml'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage-public:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Standalone verifier syntax
        run: |
          python3 -m py_compile scripts/verify-home-118641-public.py
          python3 -m py_compile scripts/verify-receiver-46573-public.py
      - name: Public HTTP GET-only verification
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/verify-home-118641-public.py
          python3 scripts/verify-receiver-46573-public.py
