name: NRY Reviry Autem Source Proof (GET only)
on:
  pull_request:
    paths:
      - 'scripts/verify-reviry-autem-source.py'
      - 'tests/test-reviry-autem-source.py'
      - '.github/workflows/nry-reviry-autem-source.yml'
      - 'reviry-autem-source-proof-56493-v1.php'
      - 'tests/test-reviry-autem-source-proof-56493.php'
      - 'na-ryby-git-publisher.php'
  workflow_run:
    workflows: ['Na-Ryby Guarded Deployer Push-to-Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: No-write exact-page fixture and parser
        run: |
          python3 -m py_compile scripts/verify-reviry-autem-source.py
          python3 tests/test-reviry-autem-source.py
          php -l reviry-autem-source-proof-56493-v1.php
          php tests/test-reviry-autem-source-proof-56493.php
      - name: Public WordPress REST + canonical HTML (GET only)
        run: python3 scripts/verify-reviry-autem-source.py --verify
      - name: Raw WP source SHA after authorized release (GET only)
        if: github.event_name == 'workflow_run'
        run: python3 scripts/verify-reviry-autem-source.py --raw
