name: Na-Ryby motor battery capacity contract
on:
  pull_request:
    paths:
      - 'motor-battery-capacity-119594-v1.php'
      - 'assets/nry-motor-battery-v1.js'
      - 'tests/test-motor-battery-capacity-119594-v1.php'
      - 'tests/test-motor-battery-capacity-v1.cjs'
      - 'scripts/verify-motor-battery-capacity-public.py'
  push:
    branches: [main]
    paths:
      - 'motor-battery-capacity-119594-v1.php'
      - 'assets/nry-motor-battery-v1.js'
      - 'tests/test-motor-battery-capacity-119594-v1.php'
      - 'tests/test-motor-battery-capacity-v1.cjs'
      - 'scripts/verify-motor-battery-capacity-public.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-site-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate PHP page/asset guard and JS math
        run: |
          php -l motor-battery-capacity-119594-v1.php
          php -l tests/test-motor-battery-capacity-119594-v1.php
          php -l na-ryby-git-publisher.php
          php tests/test-motor-battery-capacity-119594-v1.php
          node tests/test-motor-battery-capacity-v1.cjs
      - name: Read-only fresh live-page source preflight
        run: python3 scripts/verify-motor-battery-capacity-public.py
